services:
  db:
    image: postgres:16-alpine
    container_name: ventasfix_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ventasfix
      POSTGRES_PASSWORD: ventasfix_pass
      POSTGRES_DB: ventasfix_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: